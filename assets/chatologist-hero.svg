<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Chatologist turns AI chats into evidence</title>
  <desc id="desc">A polished product hero showing chat exports flowing into an evidence dashboard about AI usage, value, takeover, and human judgment.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="900" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#07111F"/>
      <stop offset="0.55" stop-color="#0B1220"/>
      <stop offset="1" stop-color="#132238"/>
    </linearGradient>
    <linearGradient id="tealBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2DD4BF"/>
      <stop offset="1" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="amberRose" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F59E0B"/>
      <stop offset="1" stop-color="#FB7185"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#020617" flood-opacity="0.35"/>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#020617" flood-opacity="0.22"/>
    </filter>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" stroke="#334155" stroke-width="1" opacity="0.22"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)" opacity="0.35"/>
  <circle cx="1275" cy="150" r="250" fill="#2563EB" opacity="0.16"/>
  <circle cx="195" cy="790" r="260" fill="#0F766E" opacity="0.18"/>
  <circle cx="820" cy="478" r="170" fill="#F59E0B" opacity="0.08"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" letter-spacing="0">
    <text x="92" y="116" fill="#E2E8F0" font-size="26" font-weight="800">CHAT EXPORTS -&gt; EVIDENCE</text>
    <text x="92" y="196" fill="#FFFFFF" font-size="76" font-weight="900">Chatologist</text>
    <text x="96" y="246" fill="#CBD5E1" font-size="30" font-weight="650">Figure out what AI is really doing.</text>
    <text x="96" y="306" fill="#94A3B8" font-size="23">Map what you, your company, or your family use AI for.</text>
    <text x="96" y="340" fill="#94A3B8" font-size="23">See the value, the takeover, and the human judgment left.</text>

    <g filter="url(#softShadow)">
      <rect x="96" y="392" width="150" height="44" rx="22" fill="#DBEAFE"/>
      <text x="128" y="421" fill="#1D4ED8" font-size="18" font-weight="800">usage</text>
      <rect x="264" y="392" width="130" height="44" rx="22" fill="#CCFBF1"/>
      <text x="302" y="421" fill="#0F766E" font-size="18" font-weight="800">value</text>
      <rect x="412" y="392" width="158" height="44" rx="22" fill="#FEF3C7"/>
      <text x="450" y="421" fill="#B45309" font-size="18" font-weight="800">takeover</text>
      <rect x="588" y="392" width="198" height="44" rx="22" fill="#FFE4E6"/>
      <text x="626" y="421" fill="#BE123C" font-size="18" font-weight="800">human edge</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="96" y="486" width="510" height="300" rx="28" fill="#F8FAFC"/>
      <text x="136" y="542" fill="#0F172A" font-size="25" font-weight="850">Exported chats</text>
      <text x="136" y="574" fill="#64748B" font-size="17" font-weight="600">OpenAI, ChatGPT, Claude, or JSONL</text>

      <rect x="136" y="610" width="370" height="46" rx="18" fill="#E0F2FE"/>
      <text x="160" y="640" fill="#075985" font-size="17" font-weight="700">"Help my brother learn circuits..."</text>
      <rect x="190" y="668" width="345" height="46" rx="18" fill="#ECFDF5"/>
      <text x="214" y="698" fill="#047857" font-size="17" font-weight="700">"Review this pricing model..."</text>
      <rect x="136" y="722" width="388" height="46" rx="18" fill="#FEF3C7"/>
      <text x="160" y="752" fill="#92400E" font-size="17" font-weight="700">"Debug this notebook output..."</text>
    </g>

    <path d="M646 630 C716 630 746 575 808 575" stroke="url(#tealBlue)" stroke-width="10" stroke-linecap="round"/>
    <path d="M785 543 L835 574 L785 606" stroke="#38BDF8" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M646 692 C724 692 745 736 813 736" stroke="url(#amberRose)" stroke-width="10" stroke-linecap="round"/>
    <path d="M790 704 L840 736 L790 768" stroke="#FB7185" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>

    <g filter="url(#shadow)">
      <rect x="858" y="138" width="650" height="632" rx="32" fill="#FFFFFF"/>
      <rect x="858" y="138" width="650" height="84" rx="32" fill="#F8FAFC"/>
      <path d="M858 190H1508" stroke="#E2E8F0" stroke-width="1"/>
      <circle cx="908" cy="180" r="8" fill="#EF4444"/>
      <circle cx="934" cy="180" r="8" fill="#F59E0B"/>
      <circle cx="960" cy="180" r="8" fill="#22C55E"/>
      <text x="998" y="187" fill="#334155" font-size="18" font-weight="800">evidence dashboard</text>

      <text x="908" y="272" fill="#0F172A" font-size="38" font-weight="900">What is AI doing?</text>
      <text x="910" y="310" fill="#64748B" font-size="18">Message-level evidence for tasks, value, automation, and review.</text>

      <rect x="910" y="356" width="266" height="156" rx="22" fill="#EFF6FF"/>
      <text x="936" y="396" fill="#1D4ED8" font-size="20" font-weight="850">Usage map</text>
      <rect x="936" y="426" width="188" height="14" rx="7" fill="#BFDBFE"/>
      <rect x="936" y="426" width="132" height="14" rx="7" fill="#2563EB"/>
      <text x="936" y="468" fill="#334155" font-size="16">learning, coding, planning</text>

      <rect x="1200" y="356" width="258" height="156" rx="22" fill="#ECFDF5"/>
      <text x="1226" y="396" fill="#047857" font-size="20" font-weight="850">Value signals</text>
      <circle cx="1248" cy="447" r="24" fill="#14B8A6"/>
      <circle cx="1318" cy="447" r="24" fill="#2DD4BF"/>
      <circle cx="1388" cy="447" r="24" fill="#99F6E4"/>
      <text x="1226" y="492" fill="#334155" font-size="16">unblocking, quality, speed</text>

      <rect x="910" y="538" width="266" height="156" rx="22" fill="#FFFBEB"/>
      <text x="936" y="578" fill="#B45309" font-size="20" font-weight="850">Takeover radar</text>
      <path d="M946 642 L1016 602 L1098 662 Z" fill="#F59E0B" opacity="0.24"/>
      <path d="M946 642 L1016 602 L1098 662" stroke="#D97706" stroke-width="5" stroke-linejoin="round"/>
      <text x="936" y="674" fill="#334155" font-size="16">drafting high, decisions low</text>

      <rect x="1200" y="538" width="258" height="156" rx="22" fill="#FFF1F2"/>
      <text x="1226" y="578" fill="#BE123C" font-size="20" font-weight="850">Human edge</text>
      <text x="1226" y="622" fill="#334155" font-size="16" font-weight="700">context selection</text>
      <text x="1226" y="650" fill="#334155" font-size="16" font-weight="700">verification</text>
      <text x="1226" y="678" fill="#334155" font-size="16" font-weight="700">domain judgment</text>
    </g>
  </g>
</svg>
