<svg width="1200" height="560" viewBox="0 0 1200 560" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Chatologist workflow</title>
  <desc id="desc">The Chatologist pipeline from exported chats to a value and automation report.</desc>
  <rect width="1200" height="560" fill="#F8FAFC"/>
  <text x="72" y="78" fill="#0F172A" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="800">From chat history to a value map</text>
  <text x="72" y="116" fill="#475569" font-family="Inter, Arial, sans-serif" font-size="18">A local-first workflow for understanding AI usage, value, takeover, and verification burden.</text>

  <g font-family="Inter, Arial, sans-serif">
    <rect x="72" y="178" width="190" height="132" rx="18" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
    <text x="98" y="222" fill="#0F172A" font-size="20" font-weight="800">1. Export</text>
    <text x="98" y="254" fill="#475569" font-size="15">OpenAI, ChatGPT,</text>
    <text x="98" y="278" fill="#475569" font-size="15">Claude, or JSONL</text>

    <rect x="310" y="178" width="190" height="132" rx="18" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
    <text x="336" y="222" fill="#0F172A" font-size="20" font-weight="800">2. Normalize</text>
    <text x="336" y="254" fill="#475569" font-size="15">Message-level CSV,</text>
    <text x="336" y="278" fill="#475569" font-size="15">JSONL, SQLite</text>

    <rect x="548" y="178" width="190" height="132" rx="18" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
    <text x="574" y="222" fill="#0F172A" font-size="20" font-weight="800">3. Lens</text>
    <text x="574" y="254" fill="#475569" font-size="15">Education, finance,</text>
    <text x="574" y="278" fill="#475569" font-size="15">engineering, custom</text>

    <rect x="786" y="178" width="190" height="132" rx="18" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
    <text x="812" y="222" fill="#0F172A" font-size="20" font-weight="800">4. Label</text>
    <text x="812" y="254" fill="#475569" font-size="15">Sampled batches for</text>
    <text x="812" y="278" fill="#475569" font-size="15">multi-agent review</text>

    <rect x="548" y="370" width="428" height="112" rx="18" fill="#0F172A"/>
    <text x="582" y="414" fill="#FFFFFF" font-size="22" font-weight="800">5. Report</text>
    <text x="582" y="448" fill="#CBD5E1" font-size="16">What are people using AI for?</text>
    <text x="582" y="474" fill="#CBD5E1" font-size="16">What value is created? What is AI taking over?</text>

    <path d="M262 244 H310" stroke="#2563EB" stroke-width="5" stroke-linecap="round"/>
    <path d="M500 244 H548" stroke="#2563EB" stroke-width="5" stroke-linecap="round"/>
    <path d="M738 244 H786" stroke="#2563EB" stroke-width="5" stroke-linecap="round"/>
    <path d="M881 310 V370" stroke="#2563EB" stroke-width="5" stroke-linecap="round"/>

    <rect x="72" y="370" width="384" height="112" rx="18" fill="#ECFDF5" stroke="#99F6E4" stroke-width="2"/>
    <text x="102" y="414" fill="#134E4A" font-size="22" font-weight="800">Privacy guardrail</text>
    <text x="102" y="448" fill="#0F766E" font-size="16">No account scraping. Use only exports you provide.</text>
    <text x="102" y="474" fill="#0F766E" font-size="16">Run the privacy scan before sharing evidence.</text>
  </g>
</svg>
