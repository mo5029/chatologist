<svg width="1600" height="940" viewBox="0 0 1600 940" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Chatologist report preview</title>
  <desc id="desc">A preview of Chatologist report outputs, including usage, value, takeover, verification burden, and human edge charts.</desc>
  <defs>
    <filter id="panelShadow" x="-10%" y="-12%" width="120%" height="128%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#0F172A" flood-opacity="0.14"/>
    </filter>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F172A"/>
      <stop offset="1" stop-color="#1E3A8A"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="940" fill="#EEF2F7"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" letter-spacing="0">
    <rect x="72" y="58" width="1456" height="824" rx="40" fill="#FFFFFF" filter="url(#panelShadow)"/>
    <rect x="72" y="58" width="1456" height="170" rx="40" fill="url(#header)"/>
    <path d="M72 190H1528" stroke="#1E293B" stroke-width="1"/>

    <text x="126" y="126" fill="#FFFFFF" font-size="42" font-weight="900">Chatologist report preview</text>
    <text x="128" y="170" fill="#CBD5E1" font-size="22">A concise map of what AI is used for, where value appears, and what still needs human judgment.</text>

    <rect x="1230" y="102" width="218" height="58" rx="29" fill="#DBEAFE"/>
    <text x="1266" y="139" fill="#1D4ED8" font-size="20" font-weight="850">sample: 10%</text>

    <rect x="126" y="274" width="288" height="138" rx="26" fill="#EFF6FF"/>
    <text x="158" y="320" fill="#1D4ED8" font-size="22" font-weight="900">Usage</text>
    <text x="158" y="360" fill="#0F172A" font-size="34" font-weight="900">42%</text>
    <text x="234" y="360" fill="#475569" font-size="18">learning + support</text>
    <rect x="158" y="382" width="206" height="12" rx="6" fill="#BFDBFE"/>
    <rect x="158" y="382" width="114" height="12" rx="6" fill="#2563EB"/>

    <rect x="452" y="274" width="288" height="138" rx="26" fill="#ECFDF5"/>
    <text x="484" y="320" fill="#047857" font-size="22" font-weight="900">Value</text>
    <text x="484" y="360" fill="#0F172A" font-size="34" font-weight="900">31%</text>
    <text x="560" y="360" fill="#475569" font-size="18">unblocking events</text>
    <rect x="484" y="382" width="206" height="12" rx="6" fill="#A7F3D0"/>
    <rect x="484" y="382" width="154" height="12" rx="6" fill="#10B981"/>

    <rect x="778" y="274" width="288" height="138" rx="26" fill="#FFFBEB"/>
    <text x="810" y="320" fill="#B45309" font-size="22" font-weight="900">Takeover</text>
    <text x="810" y="360" fill="#0F172A" font-size="34" font-weight="900">18%</text>
    <text x="886" y="360" fill="#475569" font-size="18">substitution-like</text>
    <rect x="810" y="382" width="206" height="12" rx="6" fill="#FDE68A"/>
    <rect x="810" y="382" width="84" height="12" rx="6" fill="#F59E0B"/>

    <rect x="1104" y="274" width="344" height="138" rx="26" fill="#FFF1F2"/>
    <text x="1136" y="320" fill="#BE123C" font-size="22" font-weight="900">Human edge</text>
    <text x="1136" y="360" fill="#0F172A" font-size="34" font-weight="900">63%</text>
    <text x="1212" y="360" fill="#475569" font-size="18">needs context or review</text>
    <rect x="1136" y="382" width="246" height="12" rx="6" fill="#FECDD3"/>
    <rect x="1136" y="382" width="168" height="12" rx="6" fill="#F43F5E"/>

    <rect x="126" y="462" width="654" height="330" rx="28" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
    <text x="166" y="518" fill="#0F172A" font-size="28" font-weight="900">Task distribution</text>
    <text x="166" y="550" fill="#64748B" font-size="17">Where chat activity concentrates.</text>

    <text x="166" y="606" fill="#334155" font-size="17" font-weight="750">Learning and tutoring</text>
    <rect x="366" y="588" width="330" height="22" rx="11" fill="#DBEAFE"/>
    <rect x="366" y="588" width="242" height="22" rx="11" fill="#2563EB"/>
    <text x="714" y="606" fill="#334155" font-size="17" font-weight="750">42%</text>

    <text x="166" y="656" fill="#334155" font-size="17" font-weight="750">Writing and planning</text>
    <rect x="366" y="638" width="330" height="22" rx="11" fill="#CCFBF1"/>
    <rect x="366" y="638" width="184" height="22" rx="11" fill="#14B8A6"/>
    <text x="714" y="656" fill="#334155" font-size="17" font-weight="750">31%</text>

    <text x="166" y="706" fill="#334155" font-size="17" font-weight="750">Code and analysis</text>
    <rect x="366" y="688" width="330" height="22" rx="11" fill="#FEF3C7"/>
    <rect x="366" y="688" width="114" height="22" rx="11" fill="#F59E0B"/>
    <text x="714" y="706" fill="#334155" font-size="17" font-weight="750">19%</text>

    <text x="166" y="756" fill="#334155" font-size="17" font-weight="750">Personal admin</text>
    <rect x="366" y="738" width="330" height="22" rx="11" fill="#E2E8F0"/>
    <rect x="366" y="738" width="48" height="22" rx="11" fill="#64748B"/>
    <text x="714" y="756" fill="#334155" font-size="17" font-weight="750">8%</text>

    <rect x="820" y="462" width="628" height="330" rx="28" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
    <text x="860" y="518" fill="#0F172A" font-size="28" font-weight="900">Interpretation lens</text>
    <text x="860" y="550" fill="#64748B" font-size="17">What the labels make visible.</text>

    <rect x="860" y="592" width="250" height="70" rx="20" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="890" y="623" fill="#0F172A" font-size="18" font-weight="850">Complement</text>
    <text x="890" y="648" fill="#64748B" font-size="15">AI extends human work</text>

    <rect x="1150" y="592" width="250" height="70" rx="20" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="1180" y="623" fill="#0F172A" font-size="18" font-weight="850">Partial takeover</text>
    <text x="1180" y="648" fill="#64748B" font-size="15">AI performs task chunks</text>

    <rect x="860" y="692" width="250" height="70" rx="20" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="890" y="723" fill="#0F172A" font-size="18" font-weight="850">Verification</text>
    <text x="890" y="748" fill="#64748B" font-size="15">Human checks the output</text>

    <rect x="1150" y="692" width="250" height="70" rx="20" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="1180" y="723" fill="#0F172A" font-size="18" font-weight="850">Human value</text>
    <text x="1180" y="748" fill="#64748B" font-size="15">Context, taste, judgment</text>

    <rect x="126" y="832" width="1322" height="1" fill="#E2E8F0"/>
    <text x="126" y="862" fill="#64748B" font-size="16">Designed for descriptive audits. Use stronger designs before making causal claims.</text>
  </g>
</svg>
